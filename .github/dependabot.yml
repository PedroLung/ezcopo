# Atualizações automáticas de dependências: o GitHub abre um pull request quando sai
# uma versão nova ou uma correção de segurança de qualquer pacote do projeto.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
